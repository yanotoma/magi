# Pinned so every contributor and CI job builds with the same compiler.
# rustup applies this automatically for any cargo invocation inside the repo —
# no manual version switching, unlike .nvmrc.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "default"

# No `targets` here on purpose. Listing the two Apple targets would make every
# toolchain install fetch them, including on the Linux CI jobs that run lint,
# tests and formatting and will never emit a Darwin binary. The native target is
# always present; M7's universal build adds what it needs with `rustup target
# add` at the point of use.
