name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that needs no compilation and no platform. Runs on Linux because
  # it can, and because Linux runners are abundant while macOS runners are
  # scarce — a formatting mistake should not wait in the same queue as a desktop
  # app build. `cargo fmt` only parses source, so this job needs no system
  # libraries at all.
  quick:
    name: Format, types, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml pins the version, components and targets. No
        # version argument here, so CI cannot disagree with a local build.
        run: rustup show

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Typecheck frontend
        run: npm run check

      - name: Check task counts
        # docs/TASKS.md states each task twice — as a checkbox and as a count in
        # the summary table. Hand-maintained counts drift on the first change
        # someone forgets to mirror, and nobody recounts 120 checkboxes to
        # notice. Derive the table instead of trusting it.
        run: python3 tools/task_counts.py --check

  # Lint and tests. These compile the crate, which pulls in Tauri and therefore
  # the platform's webview stack — hence the apt packages. Magi's tests are pure
  # logic and touch no platform API; they only need a build because they live in
  # a crate that depends on Tauri. See the `magi-core` note in docs/TASKS.md.
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # Two groups. Tauri needs the webview stack; M4 added the rest.
        #
        # `cmake` is for whisper.cpp, which whisper-rs compiles from source.
        # `libasound2-dev` is cpal's ALSA backend, named by cpal's own README —
        # `build-essential` gives a C++ compiler but neither of these.
        #
        # Both were missed for five commits because they were written down as a note
        # instead of added here, and nothing surfaced it: ci.yml only runs on `main`
        # and on pull requests, so no CI had touched the audio code at all. The first
        # sign would have been the PR failing.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            cmake \
            libasound2-dev

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        # No test may require a GPU, microphone, display, or network — the
        # runner has none of them, which is the point.
        run: cargo test
        working-directory: src-tauri

  # The only job that genuinely needs macOS: Tauri links WebKit, AppKit and Core
  # Graphics here, and a .app cannot be cross-compiled from Linux in practice.
  # Signing and notarization still need a Developer ID certificate and stay out
  # until there is one.
  build-macos:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Ensure cmake is present
        # whisper-rs compiles whisper.cpp, which shells out to cmake. GitHub's macOS
        # image ships it, but an undeclared dependency on the runner image is the kind
        # of thing that breaks on an image update with a message about a missing
        # binary rather than about a missing declaration. A no-op when it is there.
        run: cmake --version || brew install cmake

      - name: Install Rust toolchain
        run: rustup show

      - name: Add the Apple targets
        # Added here rather than in rust-toolchain.toml on purpose, and the note in
        # Cargo.toml says why: listing them there makes every toolchain install on
        # every platform fetch both, including the Linux jobs above that will never
        # link a Mach-O.
        #
        # The runner is Apple Silicon, so aarch64 is already present and x86_64 is
        # the one that does work. That is also where the risk is: whisper-rs compiles
        # whisper.cpp through cmake, and a C++ dependency cross-compiling to the other
        # arch is a different build from the one that passes natively.
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # --no-bundle stops before packaging. Bundling itself needs no certificate,
        # but an unsigned .app is not a thing worth spending runner minutes on; the
        # release workflow bundles once there is an identity to sign with.
        #
        # universal-apple-darwin builds both architectures and lipos them together,
        # so this compiles the crate twice and is the slowest job here by some way.
        run: npm run tauri build -- --no-bundle --target universal-apple-darwin

      - name: Assert the binary is actually universal
        # The reason this step exists rather than trusting the flag: `lipo` reports
        # what is in the file, and a build that quietly produced one architecture
        # would otherwise ship as "universal" on the strength of the argument having
        # been passed. Half the Macs in the world are the half that would find out.
        run: |
          BIN=src-tauri/target/universal-apple-darwin/release/magi
          test -f "$BIN" || { echo "no universal binary at $BIN"; exit 1; }
          ARCHS=$(lipo -archs "$BIN")
          echo "architectures: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in
              *" $want "*) ;;
              *) echo "missing $want"; exit 1 ;;
            esac
          done
