[package]
name = "magi"
version = "0.2.0-alpha.1"
description = "A background AI agent for your desktop"
authors = ["The Magi contributors"]
license = "Apache-2.0"
repository = "https://github.com/yanotoma/magi"
edition = "2021"

[lib]
# `main.rs` is a three-line entry point; `lib.rs` is the composition root.
# The split is deliberate: integration tests under `tests/` cannot import from a
# binary-only crate, and Magi's testable logic lives in modules beside `lib.rs`.
# The `_lib` suffix keeps the library name from colliding with the binary on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "magi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is required for the transparent overlay panel. It permanently
# blocks Mac App Store distribution — a deliberate tradeoff; Magi ships a signed
# DMG directly. See .claude/skills/macos-permissions/SKILL.md.
tauri = { version = "2", features = [
  "macos-private-api",
  "tray-icon",
  # Decodes the tray PNG at runtime via Image::from_bytes.
  "image-png",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
async-trait = "0.1"
# StreamExt, for iterating reqwest's byte stream.
futures-util = { version = "0.3", default-features = false }
# rustls rather than the system TLS stack: one fewer thing that differs
# between a developer machine, a CI runner, and a user's Mac.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# API keys live in the OS keychain, never in config.toml.
keyring = { version = "3", features = ["apple-native"] }
# The pre-flight vision probe generates a PNG containing a known digit. Hand-rolling
# the encoder was the alternative — tools/generate_tray_icon.py already does it in
# Python — and was rejected: a subtly malformed PNG would be accepted by the HTTP
# layer and misread by every model, reported to the user as "this model cannot see".
# That is the most expensive misdiagnosis this module can produce, and verifying a
# hand-rolled encoder would need a decoder, which is circular.
png = { version = "0.17", default-features = false }
# Both families send images base64-encoded; they disagree only on the wrapper.
base64 = "0.22"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# #[tokio::test] needs a runtime the library itself does not pull in.
tokio = { version = "1", features = ["macros", "rt"] }
# Config tests write to a throwaway directory rather than the real config dir.
tempfile = "3"
